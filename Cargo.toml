[package]
name = "ghostty-console"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/Lorangeve/ghostty-console"

[dependencies]
drm = "0.15.0"
evdev = "0.13.2"
freetype-rs = "0.38.0"
libc = "0.2.191"
libseat = "0.2.4"
shlex = "2.0.1"
signal-hook = "0.4.6"
xkbcommon = "0.9.0"
zbus = { version = "5.19.0", features = ["blocking-api"] }

[build-dependencies]
cc = "1.11.3"
pkg-config = "0.3.34"
