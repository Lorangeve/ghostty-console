# ghostty-console configuration — key = value, UTF-8.
# Search order (first existing file wins; files are not merged):
#   ./ghostty-console.conf
#   $XDG_CONFIG_HOME/ghostty-console/config  (default: ~/.config/...)
#   /etc/ghostty-console/config
# Override explicitly: ghostty-console --config-file /path/to/config con
# Lines starting with # are comments. Inline comments are not supported.
# An empty value resets an option to its built-in default.

# Font sizes are in points (13.5 pt = 18 px at 96 DPI).
font-family = FiraMono Nerd Font Mono
font-size = 13.5

# Empty IME font options inherit your fcitx5 classic UI font (e.g. 98WB-2).
# The IME and terminal fonts are separate because PUA root symbols can overlap icons.
ime-font-family =
ime-font-size =

# Executable plus arguments; shell-style quoting is accepted.
# The command is executed directly; pipes, redirects and substitutions are not evaluated.
command = /usr/bin/fish --interactive
keyboard-layout = us

# Manual con trial timeout in seconds; 0 keeps the session running until exit.
# The system login-service manages its own lifecycle and ignores this deadline.
timeout = 120
# Empty selects the first DRM card automatically.
drm-device =

status-bar-visible = true
ime-enabled = false
# inline: one flat echo line above the status bar (Emacs-style).
# popup: anchor a floating candidate window to the actual terminal caret.
# Ctrl+Alt+M switches modes for the current session.
ime-display = inline

# Empty schema uses the last-selected source schema.
rime-schema =
# Empty source defaults to $XDG_DATA_HOME/fcitx5/rime (or ~/.local/share/fcitx5/rime).
rime-source-dir =
# Separate writable learning database; never shares the active fcitx5 user database.
rime-user-dir =
rime-shared-dir = /usr/share/rime-data

# Colors accept #RRGGBB or RRGGBB. Empty keeps the terminal engine defaults.
background =
foreground =
cursor-color = #e5cf80

# Receive notify-send natively without a desktop; mirror an existing desktop server.
desktop-notifications = true
